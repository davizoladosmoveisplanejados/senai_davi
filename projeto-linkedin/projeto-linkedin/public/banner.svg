      <tspan fill="#f43f5e">&lt;</tspan><tspan fill="#ec4899">script</tspan><tspan fill="#f43f5e">&gt;</tspan>
    </text>
    <!-- Line 2 -->
    <text x="290" y="100">
      <tspan fill="#a855f7">import</tspan> <tspan fill="#38bdf8">Column</tspan> <tspan fill="#a855f7">from</tspan> <tspan fill="#22c55e">'./Column.svelte'</tspan><tspan fill="#94a3b8">;</tspan>
