      <tspan fill="#38bdf8">let</tspan> <tspan fill="#f8fafc">columns</tspan> <tspan fill="#f43f5e">=</tspan> <tspan fill="#94a3b8">[</tspan><tspan fill="#22c55e">'Backlog'</tspan><tspan fill="#94a3b8">, </tspan><tspan fill="#22c55e">'In Progress'</tspan><tspan fill="#94a3b8">, </tspan><tspan fill="#22c55e">'Done'</tspan><tspan fill="#94a3b8">];</tspan>
    </text>
    <!-- Line 5 -->
    <text x="270" y="160">
      <tspan fill="#f43f5e">&lt;/</tspan><tspan fill="#ec4899">script</tspan><tspan fill="#f43f5e">&gt;</tspan>
    </text>
    <!-- Line 6 -->
    <text x="270" y="180">
      <tspan fill="#f43f5e">&lt;</tspan><tspan fill="#38bdf8">main</tspan> <tspan fill="#fbbf24">class</tspan><tspan fill="#f43f5e">=</tspan><tspan fill="#22c55e">"kanban-board"</tspan><tspan fill="#f43f5e">&gt;</tspan>
    </text>
    <!-- Line 7 -->
    <text x="290" y="200">
      <tspan fill="#f43f5e">{#</tspan><tspan fill="#ec4899">each</tspan> <tspan fill="#f8fafc">columns</tspan> <tspan fill="#a855f7">as</tspan> <tspan fill="#38bdf8">col</tspan><tspan fill="#f43f5e">}</tspan>
    </text>
    <!-- Line 8 -->
    <text x="310" y="220">
      <tspan fill="#f43f5e">&lt;</tspan><tspan fill="#38bdf8">Column</tspan> <tspan fill="#fbbf24">name</tspan><tspan fill="#f43f5e">=</tspan><tspan fill="#94a3b8">{</tspan><tspan fill="#38bdf8">col</tspan><tspan fill="#94a3b8">}</tspan> <tspan fill="#fbbf24">items</tspan><tspan fill="#f43f5e">=</tspan><tspan fill="#94a3b8">{</tspan><tspan fill="#38bdf8">$items</tspan><tspan fill="#94a3b8">}</tspan> <tspan fill="#f43f5e">/&gt;</tspan>
    </text>
    <!-- Line 9 -->
    <text x="290" y="240">
      <tspan fill="#f43f5e">{/</tspan><tspan fill="#ec4899">each</tspan><tspan fill="#f43f5e">}</tspan>
    </text>
    <!-- Line 10 -->
    <text x="270" y="260">
      <tspan fill="#f43f5e">&lt;/</tspan><tspan fill="#38bdf8">main</tspan><tspan fill="#f43f5e">&gt;</tspan>
    </text>
  </g>

  <!-- Right side decorative blurred code preview -->
  <g opacity="0.35" transform="translate(780, 75)" font-family="monospace" font-size="11">
    <text y="20" fill="#38bdf8">const fetchProfile = async (id) =&gt; {</text>
    <text y="40" fill="#a855f7">  const res = await api.get(`/users/${id}`);</text>
    <text y="60" fill="#22c55e">  return res.data.profile;</text>
    <text y="80" fill="#38bdf8">};</text>
    <text y="110" fill="#fbbf24">export default function Dashboard() {</text>
    <text y="130" fill="#f472b6">  const [data, setData] = useState(null);</text>
    <text y="150" fill="#a855f7">  return &lt;ProfileView data={data} /&gt;;</text>
    <text y="170" fill="#fbbf24">}</text>
