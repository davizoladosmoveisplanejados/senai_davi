      <tspan fill="#a855f7">import</tspan> <tspan fill="#94a3b8">{</tspan> <tspan fill="#38bdf8">items</tspan><tspan fill="#94a3b8">, </tspan><tspan fill="#38bdf8">addCard</tspan> <tspan fill="#94a3b8">}</tspan> <tspan fill="#a855f7">from</tspan> <tspan fill="#22c55e">'./store.js'</tspan><tspan fill="#94a3b8">;</tspan>
